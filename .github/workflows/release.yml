name: Release zip

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of each month at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build zip
        run: |
          zip -r windows-11-setup.zip \
            Setup-Windows11.ps1 \
            packages.json \
            packages-manual.json \
            winget-meta.json \
            config-files.json \
            config/ \
            README.md

      - name: Compute tag
        id: tag
        run: echo "tag=v$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            windows-11-setup.zip
            Setup-Windows11.ps1
          fail_on_unmatched_files: true
